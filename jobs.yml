# SKILL SMP jobs. Edit here, then /skillsmp reload.
# Each job pays money + XP for: break (blocks), kill (mobs, use the entity name) or fish (caught item).
# mature: true = a crop only pays when fully grown.  icon = item shown in the menu (for blocks that are not items).
# Money is multiplied by the job level bonus and by jobs.multiplier in config.yml.
# Blocks placed by players never pay (stops place-and-break farming).
jobs:
  miner:
    name: "&b&lMiner"
    icon: DIAMOND_PICKAXE
    description:
      - "&7Mine stone and ores to earn money."
    break:
      STONE: {money: 0.4, xp: 1}
      DEEPSLATE: {money: 0.5, xp: 1}
      GRANITE: {money: 0.3, xp: 0.5}
      DIORITE: {money: 0.3, xp: 0.5}
      ANDESITE: {money: 0.3, xp: 0.5}
      COAL_ORE: {money: 3, xp: 4}
      DEEPSLATE_COAL_ORE: {money: 3.5, xp: 4}
      IRON_ORE: {money: 5, xp: 6}
      DEEPSLATE_IRON_ORE: {money: 6, xp: 6}
      COPPER_ORE: {money: 3, xp: 4}
      DEEPSLATE_COPPER_ORE: {money: 3.5, xp: 4}
      GOLD_ORE: {money: 8, xp: 8}
      DEEPSLATE_GOLD_ORE: {money: 9, xp: 8}
      REDSTONE_ORE: {money: 4, xp: 5}
