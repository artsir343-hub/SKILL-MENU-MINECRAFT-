# SKILL SMP crates. Edit here OR use Admin Panel -> Crates editor.
# chance = PERCENT (0-100). In the editor everything is auto-balanced so the total is 100%.
# cost: money per open (0 = free). key-required: true = needs a key instead of money.
# key-price: players can BUY a key for this price in the crate menu (0 = not sold).
# Rarity (Common / Rare / Epic / Legendary) is chosen automatically from the chance, see config.yml -> crates.
# Give keys:  /crates givekey <player> <crate> <amount>   (or Admin Panel -> Crates -> Give keys to a player)
# reward types: money (amount) | item (material, amount) | command (command, icon) | keys (crate, amount)
# display = custom name shown in the animation. A crate preview shows 27 rewards per page.
crates:
  common:
    name: "&7Common Crate"
